<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
</head>
<body>
<title>Derrame pleural de guardia</title>
<meta name="theme-color" content="#f3f6f8">
<meta name="description" content="Árbol de decisiones del derrame pleural para la guardia y la consulta, con calculadoras, ecografía y nota clínica copiable.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Atkinson+Hyperlegible+Next:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Una mano, de noche, con prisa: la decisión arriba y grande, el porqué debajo, la nota siempre a un toque.
   El árbol se dibuja como un recorrido de nodos; el color de acento es el azul petróleo del gel de ecografía. */
:root {
  --bg: #f3f6f8;
  --surface: #ffffff;
  --sunken: #e8eef2;
  --fg: #0f1b24;
  --muted: #4f6070;
  --faint: #7a8a97;
  --line: #d5dfe6;
  --accent: #0d5c78;
  --accent-2: #0a4a61;
  --accent-soft: #dcecf2;
  --accent-fg: #ffffff;
  --fluid: #9a5a00;
  --fluid-soft: #fbeed8;
  --warn: #7a4d00;
  --warn-soft: #fbefd5;
  --alert: #a12d1c;
  --alert-soft: #fbe6e1;
  --ok: #1d6b3a;
  --ok-soft: #e0f2e6;
  --shadow: 0 1px 2px rgba(13, 40, 56, .06), 0 6px 18px rgba(13, 40, 56, .07);
  --display: "Bricolage Grotesque", "Atkinson Hyperlegible Next", system-ui, sans-serif;
  --font: "Atkinson Hyperlegible Next", "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --barh: 54px;
  --navh: 64px;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c1419; --surface: #142028; --sunken: #101a21; --fg: #e2ecf1; --muted: #9fb2bf; --faint: #7d909c; --line: #26353f;
    --accent: #6cc3e0; --accent-2: #8fd3ea; --accent-soft: #15303c; --accent-fg: #07131a;
    --fluid: #f2bf6b; --fluid-soft: #2d2412; --warn: #f0c46e; --warn-soft: #2d2513; --alert: #f3a898; --alert-soft: #331c18; --ok: #93d9aa; --ok-soft: #15281c;
    --shadow: 0 1px 2px rgba(0, 0, 0, .45);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c1419; --surface: #142028; --sunken: #101a21; --fg: #e2ecf1; --muted: #9fb2bf; --faint: #7d909c; --line: #26353f;
  --accent: #6cc3e0; --accent-2: #8fd3ea; --accent-soft: #15303c; --accent-fg: #07131a;
  --fluid: #f2bf6b; --fluid-soft: #2d2412; --warn: #f0c46e; --warn-soft: #2d2513; --alert: #f3a898; --alert-soft: #331c18; --ok: #93d9aa; --ok-soft: #15281c;
  --shadow: 0 1px 2px rgba(0, 0, 0, .45);
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 16.5px; line-height: 1.5; -webkit-text-size-adjust: 100%; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.skip { position: absolute; left: -999px; top: 8px; background: var(--surface); padding: 8px 12px; border-radius: 8px; z-index: 40; }
.skip:focus { left: 8px; }

/* ---------- barra superior ---------- */
.bar { position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); padding-top: var(--safe-t); }
.bar-in { max-width: 720px; margin: 0 auto; height: var(--barh); padding: 0 6px; display: flex; align-items: center; gap: 4px; }
.bar-title { flex: 1; min-width: 0; font-family: var(--display); font-weight: 700; font-size: 1.02rem; letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-left: 4px; }
.ib { display: inline-grid; place-items: center; width: 44px; height: 44px; border-radius: 12px; border: 0; background: transparent; cursor: pointer; color: var(--muted); flex: none; }
.ib svg { width: 22px; height: 22px; }
.ib:active { background: var(--sunken); }
.ib[hidden] { display: none; }

/* ---------- contenido ---------- */
main { max-width: 720px; margin: 0 auto; padding: 12px 16px calc(var(--navh) + var(--safe-b) + 28px); display: flex; flex-direction: column; gap: 14px; }
.head { display: flex; flex-direction: column; gap: 2px; }
.eyebrow { font-size: .76rem; font-weight: 700; color: var(--accent); letter-spacing: .06em; text-transform: uppercase; }
h1 { font-family: var(--display); font-size: 1.65rem; line-height: 1.12; letter-spacing: -.02em; font-weight: 700; margin: 0; text-wrap: balance; }
.lead { margin: 0; color: var(--muted); text-wrap: pretty; max-width: 62ch; }
b.k { font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
.tag { display: inline-block; margin-left: 6px; font-family: var(--mono); font-size: .64rem; line-height: 1.4; color: var(--faint); white-space: nowrap; vertical-align: 1px; }
.tag .gr { color: var(--accent); font-weight: 500; }
.tag .kd { opacity: .85; }
.disc { font-size: .72rem; color: var(--faint); margin: 2px 0 0; }
.hint { color: var(--muted); font-size: .92rem; margin: 0; }

/* recorrido: nodos unidos, como una rama del árbol */
.path { display: flex; align-items: center; overflow-x: auto; scrollbar-width: none; margin: -2px -16px 0; padding: 2px 16px; gap: 0; }
.path[hidden] { display: none; }
.path::-webkit-scrollbar { display: none; }
.path button { flex: none; border: 0; background: none; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; min-height: 34px; padding: 0 4px; font-size: .78rem; color: var(--muted); white-space: nowrap; }
.path button::before { content: ""; width: 9px; height: 9px; border-radius: 50%; border: 2px solid var(--accent); background: var(--surface); flex: none; }
.path .ln { flex: none; width: 14px; height: 2px; background: var(--accent); opacity: .35; }
.path .now { font-weight: 700; color: var(--fg); }
.path .now::before { background: var(--accent); }

/* alerta */
.alert { display: flex; gap: 10px; background: var(--alert-soft); border-radius: 14px; padding: 12px 14px; border-left: 4px solid var(--alert); }
.alert svg { flex: none; width: 22px; height: 22px; color: var(--alert); margin-top: 1px; }

/* decisión: nodo + ramas */
.dec { display: flex; flex-direction: column; gap: 8px; }
.q { display: flex; align-items: center; gap: 10px; font-family: var(--display); font-weight: 700; font-size: 1.18rem; letter-spacing: -.01em; margin: 2px 0 0; line-height: 1.25; scroll-margin-top: calc(var(--barh) + 16px); }
.q::before { content: ""; flex: none; width: 14px; height: 14px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
.opts { position: relative; display: flex; flex-direction: column; gap: 8px; padding-left: 22px; }
.opts::before { content: ""; position: absolute; left: 6px; top: -8px; bottom: 29px; width: 2px; background: var(--accent); opacity: .4; border-radius: 2px; }
.opt { position: relative; text-align: left; min-height: 58px; padding: 12px 14px 12px 16px; border-radius: 14px; border: 1.5px solid var(--accent); background: var(--surface); cursor: pointer; display: flex; align-items: center; gap: 12px; transition: background-color .15s, transform .12s; }
.opt::before { content: ""; position: absolute; left: -17px; top: 50%; width: 15px; height: 2px; background: var(--accent); opacity: .4; }
.opt .ot { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.opt .ol { font-size: 1.02rem; font-weight: 600; line-height: 1.3; }
.opt .os { font-size: .74rem; color: var(--muted); margin-top: 2px; }
.opt svg { flex: none; width: 20px; height: 20px; color: var(--accent); }
.opt:active { background: var(--accent-soft); transform: translateY(1px); }
.opt.solo { background: var(--accent); color: var(--accent-fg); }
.opt.solo svg, .opt.solo .os { color: var(--accent-fg); opacity: .85; }

/* herramientas de la pantalla */
.tools { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.tools-l { font-size: .75rem; color: var(--muted); margin-right: 2px; }
.tools button, .chipbtn { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; min-height: 38px; padding: 0 13px; font-size: .86rem; font-weight: 600; color: var(--accent); cursor: pointer; }
.tools button:active, .chipbtn:active { background: var(--accent-soft); }

/* porqué */
.why { display: flex; flex-direction: column; gap: 10px; }
.why-h { display: flex; align-items: center; gap: 8px; margin: 6px 0 -2px; font-size: .74rem; font-weight: 700; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; }
.why-h::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.facts { list-style: none; margin: 0; padding: 0; background: var(--surface); border-radius: 16px; box-shadow: var(--shadow); }
.facts li { padding: 12px 14px; border-top: 1px solid var(--line); text-wrap: pretty; }
.facts li:first-child { border-top: 0; }
.blk-h { display: flex; align-items: center; gap: 8px; margin: 0; font-size: .8rem; font-weight: 700; color: var(--accent); letter-spacing: .01em; }
.blk-h svg { width: 18px; height: 18px; }
.ecoblk { background: var(--surface); border-radius: 16px; box-shadow: var(--shadow); padding: 12px 14px 4px; }
.ecoblk ul, .plan ul { list-style: none; margin: 6px 0 0; padding: 0; }
.ecoblk li, .plan li { padding: 8px 0; border-top: 1px solid var(--line); text-wrap: pretty; }
.ecoblk li:first-child, .plan li:first-child { border-top: 0; }
.plan { background: var(--surface); border-radius: 16px; box-shadow: var(--shadow); padding: 12px 14px; border: 1.5px solid var(--accent); }
.plan-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.copy { border: 0; background: var(--accent); color: var(--accent-fg); font-weight: 700; font-size: .86rem; border-radius: 10px; min-height: 42px; padding: 0 16px; cursor: pointer; }
.copy:active { transform: translateY(1px); }
.jc { margin: 8px 0 2px; display: flex; flex-direction: column; gap: 2px; }
.jc span { font-size: .72rem; color: var(--muted); }
.jc b { font-size: 1.05rem; line-height: 1.3; }
.plan-s { margin: 10px 0 0; font-size: .74rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.regs, .drugs { display: flex; flex-direction: column; gap: 8px; }
.reg { background: var(--surface); border-radius: 14px; box-shadow: var(--shadow); padding: 12px 14px; }
.reg > b { display: block; margin-bottom: 6px; }
.reg p { margin: 4px 0 0; }
.rl { display: block; font-size: .72rem; font-weight: 700; color: var(--accent); text-transform: uppercase; letter-spacing: .03em; }
.regsrc { margin: 0; display: flex; flex-direction: column; gap: 2px; font-size: .8rem; color: var(--muted); }
.drug { background: var(--surface); border-radius: 14px; box-shadow: var(--shadow); }
.drug summary { min-height: 52px; padding: 10px 14px; display: flex; align-items: center; justify-content: space-between; gap: 8px; cursor: pointer; list-style: none; }
.drug summary::-webkit-details-marker { display: none; }
.drug summary::after { content: "+"; font-weight: 700; color: var(--accent); font-size: 1.2rem; }
.drug[open] summary::after { content: "−"; }
.drug summary .tag { margin-left: auto; }
.drug-b { padding: 0 14px 12px; }
.drug-b p { margin: 6px 0; }
.drug-h { font-size: .72rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; margin-top: 12px !important; }
.drug dl { display: grid; grid-template-columns: minmax(84px, auto) 1fr; gap: 4px 10px; margin: 4px 0 0; font-size: .92rem; }
.drug dt { color: var(--muted); }
.drug dd { margin: 0; }
.drug-src { font-size: .8rem; }
.legend { display: block; margin-top: 2px; font-style: italic; }

/* ---------- calculadoras ---------- */
.calc { background: var(--surface); border-radius: 16px; box-shadow: var(--shadow); padding: 14px; display: flex; flex-direction: column; gap: 12px; }
.calc h2 { font-size: .86rem; font-weight: 700; color: var(--muted); margin: 0; }
.out { position: sticky; top: calc(var(--barh) + var(--safe-t) + 8px); z-index: 5; border-radius: 12px; padding: 12px; background: var(--sunken); border: 1px solid var(--line); display: flex; flex-direction: column; gap: 6px; font-size: .92rem; }
.out-low { position: static; margin-top: 12px; }
.out-low[hidden] { display: none; }
.out > span { font-size: .8rem; color: var(--muted); line-height: 1.4; }
.out .hint { font-size: .92rem; }
.verdict { font-weight: 700; font-size: 1.12rem; line-height: 1.3; }
.verdict.ok { color: var(--ok); } .verdict.bad { color: var(--alert); } .verdict.mid { color: var(--warn); }
.row { display: flex; justify-content: space-between; gap: 10px; font-variant-numeric: tabular-nums; }
.row b { font-family: var(--mono); font-weight: 500; text-align: right; flex-shrink: 0; max-width: 55%; }
.row b.cor { white-space: nowrap; font-size: .8rem; color: var(--accent); }
.row b.y { color: var(--alert); font-weight: 600; } .row b.n { color: var(--muted); }
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.grid.one { grid-template-columns: minmax(0, 1fr); }
.sub { font-size: .72rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; margin-top: 4px; }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field label, .flab { font-size: .8rem; color: var(--muted); line-height: 1.25; }
.field input, .field textarea { font: inherit; font-size: 17px; min-height: 48px; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); width: 100%; font-variant-numeric: tabular-nums; }
.field textarea { min-height: 70px; resize: vertical; font-size: 16px; }
.field input:focus, .field textarea:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
.field input.kpf { cursor: pointer; caret-color: var(--accent); font-family: var(--mono); }
.field input.kp-on { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.check { display: flex; align-items: center; gap: 12px; font-size: .97rem; min-height: 48px; border: 1.5px solid var(--line); border-radius: 12px; padding: 8px 12px; margin-top: 6px; background: var(--surface); cursor: pointer; }
.check input { width: 22px; height: 22px; accent-color: var(--accent); flex: none; margin: 0; }
.check:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); font-weight: 600; }
.radios .check { align-items: flex-start; padding-top: 10px; padding-bottom: 10px; }
.radios .check input { margin-top: 2px; }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg button { flex: 1 1 auto; min-height: 44px; padding: 6px 12px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--surface); cursor: pointer; font-size: .92rem; line-height: 1.25; font-variant-numeric: tabular-nums; }
.seg:not(.col) { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); }
.seg:not(.col) button { padding: 6px 4px; }
.seg.col { flex-direction: column; }
.seg.col button { text-align: left; }
.seg button[aria-checked="true"] { border-color: var(--accent); background: var(--accent); color: var(--accent-fg); font-weight: 600; }
.out .copy.mini { align-self: flex-start; min-height: 34px; font-size: .78rem; padding: 0 12px; }
.addn { align-self: flex-start; border: 1px dashed var(--accent); background: transparent; color: var(--accent); font-weight: 700; font-size: .78rem; border-radius: 10px; min-height: 34px; padding: 0 12px; cursor: pointer; }

/* ---------- inicio ---------- */
.hero { display: flex; flex-direction: column; gap: 6px; padding-top: 4px; }
.hero h1 { font-size: 2.1rem; }
.start { display: flex; align-items: center; gap: 14px; text-align: left; border: 0; border-radius: 18px; background: var(--accent); color: var(--accent-fg); padding: 18px 18px; cursor: pointer; box-shadow: var(--shadow); min-height: 84px; }
.start svg { width: 30px; height: 30px; flex: none; }
.start b { display: block; font-family: var(--display); font-size: 1.3rem; line-height: 1.15; }
.start span { display: block; font-size: .86rem; opacity: .88; margin-top: 2px; }
.start .go { margin-left: auto; width: 24px; height: 24px; }
.start:active { transform: translateY(1px); background: var(--accent-2); }
.doors { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.door { text-align: left; border: 1.5px solid var(--line); border-radius: 16px; background: var(--surface); padding: 12px 14px; min-height: 96px; display: flex; flex-direction: column; justify-content: space-between; gap: 8px; cursor: pointer; }
.door svg { width: 24px; height: 24px; color: var(--accent); }
.door b { display: block; font-size: 1rem; line-height: 1.2; }
.door span { display: block; font-size: .78rem; color: var(--muted); margin-top: 2px; line-height: 1.3; }
.door:active { background: var(--accent-soft); border-color: var(--accent); }
.sect-h { font-size: .74rem; font-weight: 700; color: var(--muted); margin: 6px 0 -4px; letter-spacing: .06em; text-transform: uppercase; }
.list { list-style: none; margin: 0; padding: 0; background: var(--surface); border-radius: 16px; box-shadow: var(--shadow); overflow: hidden; }
.list li + li { border-top: 1px solid var(--line); }
.list button { width: 100%; border: 0; background: none; text-align: left; min-height: 54px; padding: 10px 14px; display: flex; align-items: center; gap: 12px; cursor: pointer; }
.list button:active { background: var(--accent-soft); }
.list .li-ic { width: 22px; height: 22px; color: var(--accent); flex: none; }
.list .lt { flex: 1; min-width: 0; }
.list small { display: block; color: var(--muted); font-size: .78rem; }
.list .chev { width: 18px; height: 18px; color: var(--faint); flex: none; }

/* ---------- ecografía ---------- */
.eco { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; }
.eco figure { margin: 0; background: var(--surface); border-radius: 14px; overflow: hidden; box-shadow: var(--shadow); }
.eco .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 2px; background: #000; }
.eco img { width: 100%; max-width: 100%; height: auto; display: block; aspect-ratio: 211 / 157; object-fit: cover; }
.eco figcaption { padding: 9px 12px; font-size: .9rem; display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.eco figcaption span { color: var(--accent); font-weight: 600; }

/* ---------- bibliografía ---------- */
.biblio { margin-top: 6px; padding-top: 10px; border-top: 1px solid var(--line); }
.biblio h3 { font-size: .68rem; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--faint); margin: 0 0 6px; }
.biblio ol, .refs { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px; font-size: .72rem; line-height: 1.45; color: var(--faint); }
.refs { font-size: .8rem; color: var(--muted); gap: 9px; }
.biblio b, .refs b { font-family: var(--mono); font-weight: 500; color: var(--muted); }
.refs b { color: var(--fg); }
.biblio a, .refs a { color: var(--accent); word-break: break-word; }
.foot-links { display: flex; gap: 4px; flex-wrap: wrap; margin: 0 -10px; }
.foot-links button { border: 0; background: none; color: var(--accent); font-size: .86rem; font-weight: 700; min-height: 42px; padding: 0 10px; cursor: pointer; }

/* ---------- árbol ---------- */
.tree, .tree ul { list-style: none; margin: 0; padding: 0; }
.tree { display: flex; flex-direction: column; gap: 10px; }
.tree > li { background: var(--surface); border-radius: 16px; box-shadow: var(--shadow); padding: 6px; }
.tree ul { margin-left: 21px; padding-left: 12px; border-left: 2px solid var(--line); }
.tree ul > li { position: relative; }
.tree ul > li::before { content: ""; position: absolute; left: -12px; top: 26px; width: 10px; height: 2px; background: var(--line); }
.tn-row { display: flex; align-items: stretch; gap: 4px; }
.tn-tg { flex: none; width: 40px; min-height: 48px; border: 0; background: none; color: var(--accent); cursor: pointer; display: grid; place-items: center; border-radius: 10px; }
.tn-tg svg { width: 18px; height: 18px; transition: transform .15s; }
.tn-tg[aria-expanded="true"] svg { transform: rotate(90deg); }
.tn-tg:disabled { color: var(--line); cursor: default; }
.tn-tg:disabled svg { display: none; }
.tn-tg:disabled::after { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--faint); }
.tn-go { flex: 1; min-width: 0; text-align: left; border: 0; background: none; cursor: pointer; border-radius: 10px; padding: 6px 8px; display: flex; flex-direction: column; justify-content: center; }
.tn-go:active { background: var(--accent-soft); }
.tn-l { font-weight: 600; line-height: 1.3; }
.tree > li > .tn-row .tn-l { font-size: 1.05rem; }
.tn-s { font-size: .75rem; color: var(--muted); line-height: 1.3; }
.tn-s b { color: var(--accent); font-weight: 600; }
.tn-loop .tn-l { font-weight: 400; color: var(--muted); }

function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function svg(name) { var s = el('span'); s.innerHTML = ICON[name]; return s.firstChild; }
function num(id) { var v = document.getElementById(id); if (!v) return NaN; var s = String(v.value).replace(',', '.').trim(); return s === '' ? NaN : parseFloat(s); }

function systemDark() { return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches; }
function applyTheme(t) {
  var root = document.documentElement;
  if (t) root.setAttribute('data-theme', t); else root.removeAttribute('data-theme');
  var dark = t ? t === 'dark' : systemDark();
  var b = document.getElementById('theme');
  b.setAttribute('aria-label', dark ? 'Cambiar a modo día' : 'Cambiar a modo noche');
  b.setAttribute('aria-pressed', dark ? 'true' : 'false');

    if (s.id === 'liq') { var nums = [].slice.call(b.querySelectorAll('.field input.kpf')).map(function (x) { return x.closest('.field'); }); var gr = el('div', 'grid'); nums.forEach(function (f) { gr.appendChild(f); }); b.insertBefore(gr, b.querySelector('.grp:last-child')); }
    if (s.id === 'eco' || s.id === 'liq') { var wn = el('div', 'nwarn'); wn.id = 'nw-' + s.id; wn.setAttribute('role', 'status'); wn.hidden = true; b.appendChild(wn); }
    d.appendChild(b);
    d.addEventListener('toggle', function () { if (d.open) NOTE_OPEN = s.id; });
    v.appendChild(d);
  });
  v.appendChild(el('p', 'why-h', 'Vista previa'));
  var pre = el('pre', 'npreview'); pre.id = 'npre'; v.appendChild(pre);
  var conf = el('div', 'confirm'); conf.hidden = true;
  conf.appendChild(el('span', null, '¿Borrar toda la nota?'));
  var yes = el('button', 'ghost', 'Borrar'); yes.type = 'button'; var no = el('button', 'ghost', 'Cancelar'); no.type = 'button';
  conf.appendChild(yes); conf.appendChild(no);
  var act = el('div', 'nact');
  var cp = el('button', 'copy', 'Copiar nota'); cp.type = 'button';
  cp.addEventListener('click', function () { var t = noteText(); if (t) copyText(t, cp); });
  var nw = el('button', 'ghost', 'Nueva'); nw.type = 'button';
  nw.addEventListener('click', function () { conf.hidden = false; });
  no.addEventListener('click', function () { conf.hidden = true; });
  yes.addEventListener('click', function () { NF = {}; NOTE = { path: [], calcs: {}, calcOrder: [], plans: {}, planOrder: [] }; NOTE_OPEN = 'cli'; render('nota'); top0(); });
  act.appendChild(cp); act.appendChild(nw);
  v.appendChild(conf); v.appendChild(act);
  v.appendChild(el('p', 'disc', 'Revisa el texto antes de pegarlo en la historia. No escribas datos que identifiquen al paciente.'));
  noteRefresh();
}

// ---------- búsqueda ----------
function openSearch() {
  var sh = document.getElementById('sheet'); sh.hidden = false;
  if (HIST) { try { history.pushState({ id: cur, d: stack.length, sheet: 1 }, '', '#' + cur); } catch (_) {} }
  document.getElementById('nav-find').setAttribute('aria-current', 'page');
  var q = document.getElementById('q'); q.value = ''; showResults('');
  setTimeout(function () { q.focus(); }, 30);
}
// quiet: cerrar sin tocar el historial (al navegar o desde popstate)
function closeSearch(quiet) {
  var sh = document.getElementById('sheet'); if (sh.hidden) return;
  if (!quiet && HIST && history.state && history.state.sheet) { history.back(); return; }
  sh.hidden = true; document.getElementById('nav-find').removeAttribute('aria-current');
}
function showResults(raw) {
  var q = norm(raw.trim()), r = document.getElementById('results'); r.innerHTML = '';
  if (q.length < 2) {
    r.appendChild(el('p', 'sect-h', 'Búsquedas frecuentes'));
    var sg = el('div', 'sugg');
    SUGG.forEach(function (w) { var b = el('button', null, w); b.type = 'button'; b.addEventListener('click', function () { var i = document.getElementById('q'); i.value = w; showResults(w); }); sg.appendChild(b); });
    r.appendChild(sg); return;
  }
  var hits = Object.keys(S).filter(function (k) {
    if (k === 'inicio') return false;
    var s = S[k], fx = function (a) { return (a || []).map(function (f) { return f[0]; }).join(' '); };
    var txt = s.t + ' ' + (s.lead || '') + ' ' + fx(s.info) + ' ' + fx(s.eco_s) + ' ' + (s.op || []).map(function (o) { return o.l; }).join(' ') +
      (s.plan ? ' ' + s.plan.jc + ' ' + fx(s.plan.pedir) + ' ' + fx(s.plan.tto) + ' ' + fx(s.plan.ingreso) : '') +
      (s.drugs ? ' ' + s.drugs.map(function (d) { return d.n; }).join(' ') : '') + (s.regimens ? ' ' + s.regimens.map(function (r) { return r.t + ' ' + r.p + ' ' + r.a; }).join(' ') : '');
    return norm(txt).indexOf(q) !== -1;
  }).sort(function (x, y) { return (norm(S[y].t).indexOf(q) !== -1) - (norm(S[x].t).indexOf(q) !== -1); }).slice(0, 12);
  if (!hits.length) { r.appendChild(el('p', 'empty', 'Nada con «' + raw.trim() + '». Prueba con otra palabra o abre el árbol.')); r.appendChild(list([['mapa', 'Árbol de decisiones']])); return; }
  r.appendChild(list(hits.map(function (k) { return [k, S[k].t, SECS[S[k].sec]]; })));
}
document.getElementById('q').addEventListener('input', function () { showResults(this.value); });
document.getElementById('q').addEventListener('keydown', function (e) { if (e.key === 'Escape') closeSearch(); if (e.key === 'Enter') { var f = document.querySelector('#results .list button'); if (f) f.click(); } });
document.getElementById('sheet-close').addEventListener('click', function () { closeSearch(); });
document.getElementById('nav-find').addEventListener('click', function () { if (document.getElementById('sheet').hidden) openSearch(); else closeSearch(); });
document.getElementById('back').addEventListener('click', goBack);
document.getElementById('nav-home').addEventListener('click', function () { go('inicio'); });
document.getElementById('nav-tree').addEventListener('click', function () { go('mapa'); });
document.getElementById('nav-note').addEventListener('click', function () { go('nota'); });
document.getElementById('nav-calc').addEventListener('click', function () { go('calcs'); });

(function start() {
  var h = (location.hash || '').replace('#', '');
  go(isScreen(h) ? h : 'inicio', { push: false });
})();

</script>
